<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightdrive: Radio Halcyon 88.4</title>
<style>
:root{
  --sky1:#0d0221;--sky2:#2a0f4a;--sky3:#ff2e88;--floor:#0b0418;
  --grid:#ff2a6d;--neon:#2de2e6;--sunA:#ffd319;--sunB:#ff2975;--sunC:#8c1eff;
  --hz:58%;
  --display:Futura,"Futura PT","Avenir Next","Trebuchet MS","Arial Black",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --script:"Brush Script MT","Segoe Script","Snell Roundhand",cursive;
}
:root[data-theme="midnight"]{--sky1:#01010a;--sky2:#0a1840;--sky3:#2f6bff;--floor:#020414;--grid:#33ccff;--neon:#b967ff;--sunA:#ffffff;--sunB:#7aa2ff;--sunC:#3a1cff}
:root[data-theme="acid"]{--sky1:#030803;--sky2:#0c2610;--sky3:#39ff14;--floor:#020702;--grid:#c6ff00;--neon:#ff00e6;--sunA:#fff700;--sunB:#39ff14;--sunC:#00a86b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--sky1);color:#fff;font-family:var(--display);user-select:none;-webkit-user-select:none;touch-action:none}
.world{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,var(--sky3) var(--hz));transform-origin:50% var(--hz);will-change:transform}
#stars{position:absolute;inset:0;width:100%;height:100%}
.sunwrap{position:absolute;left:50%;top:var(--hz);width:min(58vw,48vh);aspect-ratio:1;transform:translate(-50%,-62%);will-change:transform}
.sun{width:100%;height:100%;border-radius:50%;background:linear-gradient(180deg,var(--sunA) 8%,var(--sunB) 55%,var(--sunC) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0 46%,transparent 46% 48.5%,#000 48.5% 55%,transparent 55% 58.5%,#000 58.5% 64%,transparent 64% 68.5%,#000 68.5% 73%,transparent 73% 78.5%,#000 78.5% 82%,transparent 82% 88.5%,#000 88.5% 91%,transparent 91%);
  mask-image:linear-gradient(180deg,#000 0 46%,transparent 46% 48.5%,#000 48.5% 55%,transparent 55% 58.5%,#000 58.5% 64%,transparent 64% 68.5%,#000 68.5% 73%,transparent 73% 78.5%,#000 78.5% 82%,transparent 82% 88.5%,#000 88.5% 91%,transparent 91%);
  filter:drop-shadow(0 0 30px var(--sunB));animation:set 26s ease-in-out infinite alternate}
@keyframes set{from{transform:translateY(-6%)}to{transform:translateY(22%)}}
.glow{position:absolute;left:50%;top:var(--hz);width:140vw;height:60vh;transform:translate(-50%,-50%);background:radial-gradient(50% 40% at 50% 50%,color-mix(in srgb,var(--sunB) 45%,transparent),transparent 70%);pointer-events:none;mix-blend-mode:screen;opacity:.7}
.mountains{position:absolute;left:-6%;width:112%;top:var(--hz);height:22vh;transform:translateY(-100%);will-change:transform}
.mountains path.back{fill:var(--floor);stroke:color-mix(in srgb,var(--neon) 55%,transparent);stroke-width:1.2;vector-effect:non-scaling-stroke}
.mountains path.front{fill:var(--floor);stroke:var(--neon);stroke-width:1.6;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px var(--neon))}
.mountains path.wire{fill:none;stroke:color-mix(in srgb,var(--neon) 35%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.ground{position:absolute;left:0;right:0;top:var(--hz);bottom:0;overflow:hidden;background:var(--floor);perspective:220px;perspective-origin:50% 0%}
.plane{position:absolute;left:-300%;width:700%;bottom:0;height:260%;transform-origin:50% 100%;transform:rotateX(78deg);
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:80px 80px;
  filter:drop-shadow(0 0 3px var(--grid))}
.ground::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--floor) 0%,color-mix(in srgb,var(--floor) 60%,transparent) 14%,transparent 45%,color-mix(in srgb,var(--floor) 40%,transparent));pointer-events:none}
.horizon{position:absolute;left:0;right:0;top:var(--hz);height:2px;transform:translateY(-1px);background:var(--neon);box-shadow:0 0 12px 2px var(--neon),0 0 40px 6px color-mix(in srgb,var(--neon) 40%,transparent);overflow:hidden;opacity:var(--hzo,.85)}
.horizon::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 3.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes scan{from{transform:translateX(-120%)}to{transform:translateX(450%)}}
.title{position:absolute;left:0;right:0;top:clamp(48px,11vh,110px);text-align:center;pointer-events:none;padding:0 16px}
.title h1{font-weight:900;font-style:italic;font-size:clamp(46px,13vw,148px);letter-spacing:-.02em;line-height:.9;transform:skewX(-8deg);
  background:linear-gradient(180deg,#fff 0%,#dfe6ff 30%,#7d7cff 48%,#1b0f3a 50%,#ff7ad9 52%,#ffd0f0 72%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.35);filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px color-mix(in srgb,var(--sunB) 60%,transparent))}
.title .script{display:block;font-family:var(--script);font-style:normal;font-weight:400;font-size:clamp(34px,7vw,74px);color:#fff;margin-top:-.42em;transform:rotate(-6deg);
  text-shadow:0 0 6px var(--neon),0 0 18px var(--neon),0 0 42px var(--neon)}
.title p{font-family:var(--mono);font-size:clamp(10px,1.3vw,13px);letter-spacing:.4em;text-transform:uppercase;margin-top:clamp(10px,2vh,22px);opacity:.85;text-shadow:0 0 8px var(--grid)}
.hud{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:18px clamp(16px,4vw,40px);font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;flex-wrap:wrap;z-index:3}
.speed b{display:block;font-size:clamp(32px,5vw,48px);letter-spacing:.04em;font-weight:700;color:var(--neon);text-shadow:0 0 12px var(--neon);font-variant-numeric:tabular-nums;line-height:1}
.themes{display:flex;gap:8px}
.themes button{all:unset;cursor:pointer;padding:9px 14px;border:1px solid color-mix(in srgb,var(--neon) 60%,transparent);color:#fff;background:rgba(0,0,0,.3);transition:background .25s,box-shadow .25s,color .25s;font-size:11px;letter-spacing:.2em}
.themes button:hover,.themes button:focus-visible{box-shadow:0 0 14px var(--neon);background:color-mix(in srgb,var(--neon) 20%,transparent)}
.themes button[aria-pressed="true"]{background:var(--neon);color:#0b0418;box-shadow:0 0 18px var(--neon)}
.boost{opacity:.85}
.boost kbd{font-family:inherit;border:1px solid currentColor;padding:2px 6px;margin:0 4px}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 4px),#fff;mix-blend-mode:overlay}
.flash.on{animation:flash .45s steps(4) both}
@keyframes flash{0%{opacity:.9;transform:translateY(-4%)}50%{opacity:.5;transform:translateY(3%)}100%{opacity:0;transform:none}}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:4}
@media (max-width:560px){:root{--hz:56%}.boost{display:none}.hud{justify-content:center;text-align:center}}
@media (prefers-reduced-motion:reduce){.sun,.horizon::after{animation:none}.flash.on{animation:none}}
</style>
</head>
<body>
<div class="world" id="world">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <div class="sunwrap" id="sun" aria-hidden="true"><div class="sun"></div></div>
  <svg class="mountains" id="mtn" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
    <path class="back" d="M0 200 L0 130 L60 96 L120 120 L190 62 L250 104 L300 86 L360 128 L420 150 L580 150 L640 120 L700 70 L760 108 L820 54 L890 100 L940 82 L1000 118 L1000 200Z"/>
    <path class="front" d="M0 200 L0 168 L70 140 L130 158 L200 112 L260 150 L330 132 L390 170 L610 170 L670 136 L730 152 L800 104 L860 146 L930 128 L1000 156 L1000 200Z"/>
    <path class="wire" d="M200 112 L230 200 M200 112 L160 200 M70 140 L90 200 M330 132 L300 200 M800 104 L770 200 M800 104 L840 200 M930 128 L950 200 M670 136 L690 200 M190 62 L210 112 M820 54 L800 104 M700 70 L730 152"/>
  </svg>
  <div class="ground" aria-hidden="true"><div class="plane" id="plane"></div></div>
  <div class="horizon" id="hzl" aria-hidden="true"></div>
  <header class="title">
    <h1>NIGHTDRIVE</h1>
    <span class="script">forever</span>
    <p>Radio Halcyon &middot; 88.4 FM &middot; till the sun comes back</p>
  </header>
  <div class="hud">
    <div class="speed" aria-live="off"><b id="spd">088</b>km/h &middot; cruise</div>
    <div class="boost" id="boostHint">Hold <kbd>Space</kbd> or press to boost &middot; steer with pointer</div>
    <div class="themes" role="group" aria-label="Colour cassette">
      <button type="button" data-t="sunset" aria-pressed="true">Sunset</button>
      <button type="button" data-t="midnight" aria-pressed="false">Midnight</button>
      <button type="button" data-t="acid" aria-pressed="false">Acid</button>
    </div>
  </div>
</div>
<div class="scan" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<script>
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root=document.documentElement,world=document.getElementById("world"),plane=document.getElementById("plane"),
      sun=document.getElementById("sun"),mtn=document.getElementById("mtn"),hzl=document.getElementById("hzl"),
      spd=document.getElementById("spd"),flash=document.getElementById("flash"),cv=document.getElementById("stars"),ctx=cv.getContext("2d");
  var W,H,dpr,hz,stars=[],speed=reduce?0:1,target=reduce?0:1,boosting=false,steer=0,steerT=0,z=0,x=0,t=0,last=performance.now();
  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    hz=H*parseFloat(getComputedStyle(root).getPropertyValue("--hz"))/100;
    stars=[];var n=Math.round(W*hz/2600);
    for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.pow(Math.random(),1.3)*hz*.92,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.5+Math.random()*2});
  }
  function drawStars(){
    ctx.clearRect(0,0,W,H);
    var vx=W/2,vy=hz,streak=Math.max(0,speed-1.2);
    ctx.lineCap="round";
    for(var i=0;i<stars.length;i++){
      var s=stars[i],a=reduce?.7:.35+.65*Math.abs(Math.sin(t*s.s+s.p)),fade=1-s.y/hz*.6,px=s.x-steer*12*(1-s.y/hz);
      if(streak>0){
        var dx=px-vx,dy=s.y-vy,k=streak*.05;
        ctx.strokeStyle="rgba(255,255,255,"+(a*fade).toFixed(3)+")";ctx.lineWidth=s.r;
        ctx.beginPath();ctx.moveTo(px,s.y);ctx.lineTo(px+dx*k,s.y+dy*k);ctx.stroke();
      }else{
        ctx.fillStyle="rgba(255,255,255,"+(a*fade).toFixed(3)+")";ctx.fillRect(px,s.y,s.r,s.r);
      }
    }
  }
  function loop(now){
    var dt=Math.min(3,(now-last)/16.67);last=now;t+=dt*.016;
    speed+=(target-speed)*.04*dt;steer+=(steerT-steer)*.06*dt;
    z=(z+speed*3.2*dt)%80;x=(x-steer*speed*2.4*dt)%80;
    plane.style.backgroundPosition=x.toFixed(2)+"px "+z.toFixed(2)+"px";
    world.style.transform="rotate("+(steer*-1.6).toFixed(3)+"deg)";
    mtn.style.transform="translate("+(-steer*26).toFixed(2)+"px,-100%)";
    sun.style.transform="translate(calc(-50% + "+(-steer*9).toFixed(2)+"px),-62%)";
    root.style.setProperty("--hzo",(.7+Math.min(.3,(speed-1)*.15)+(reduce?0:.08*Math.sin(t*3))).toFixed(3));
    spd.textContent=("00"+Math.round(reduce?88:speed*88)).slice(-3);
    drawStars();
    requestAnimationFrame(loop);
  }
  function setBoost(on){boosting=on;if(!reduce)target=on?3.4:1}
  addEventListener("pointermove",function(e){steerT=Math.max(-1,Math.min(1,(e.clientX/W-.5)*2))});
  addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;setBoost(true)});
  addEventListener("pointerup",function(){setBoost(false)});
  addEventListener("pointercancel",function(){setBoost(false)});
  addEventListener("blur",function(){setBoost(false)});
  addEventListener("keydown",function(e){
    if(e.code==="Space"&&!(e.target.closest&&e.target.closest("button"))){e.preventDefault();setBoost(true)}
    if(e.key==="ArrowLeft")steerT=Math.max(-1,steerT-.25);
    if(e.key==="ArrowRight")steerT=Math.min(1,steerT+.25);
  });
  addEventListener("keyup",function(e){if(e.code==="Space")setBoost(false)});
  var btns=document.querySelectorAll(".themes button");
  Array.prototype.forEach.call(btns,function(b){b.addEventListener("click",function(){
    if(b.dataset.t==="sunset")root.removeAttribute("data-theme");else root.setAttribute("data-theme",b.dataset.t);
    Array.prototype.forEach.call(btns,function(o){o.setAttribute("aria-pressed",o===b?"true":"false")});
    flash.classList.remove("on");void flash.offsetWidth;flash.classList.add("on");
  })});
  var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(resize,100)});
  resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
