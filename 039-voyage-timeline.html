<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Halcyon Wren Voyage</title>
<style>
:root{
  --sea:#d9e8e4;--sea2:#c4dbd6;--ink:#13294b;--ink2:#3d5878;--land:#efe6d2;--land-e:#b7a684;
  --signal:#e8562a;--paper:#f6f3ea;
  --ease:cubic-bezier(.65,0,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  overflow-x:hidden;min-height:100vh;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,"Courier New",monospace}
header{padding:clamp(24px,5vw,56px) clamp(16px,5vw,64px) 18px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;border-bottom:1px solid rgba(19,41,75,.18)}
header small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--signal)}
header h1{font-weight:400;font-size:clamp(32px,6vw,68px);line-height:.95;letter-spacing:-.015em;margin-top:8px}
header h1 em{font-style:italic;color:var(--ink2)}
header p{max-width:52ch;margin-top:12px;font-size:16px;line-height:1.55;color:var(--ink2)}
.tally{text-align:right;font-size:11px;letter-spacing:.14em;line-height:1.9;color:var(--ink2)}
.tally b{display:block;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;color:var(--ink);font-weight:400;font-family:"Iowan Old Style",Palatino,Georgia,serif}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);padding:clamp(16px,3vw,40px) clamp(16px,5vw,64px) 48px}
.chart{position:relative;background:var(--sea);border:1px solid rgba(19,41,75,.25);border-radius:4px;overflow:hidden;align-self:start}
.chart svg{display:block;width:100%;height:auto}
.chart .lbl{font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:.12em;fill:var(--ink2)}
.chart .isl{fill:var(--land);stroke:var(--land-e);stroke-width:1}
.chart .hatchp{fill:url(#hatch);stroke:none}
.chart .contour{fill:none;stroke:rgba(19,41,75,.18);stroke-width:.8;stroke-dasharray:2 3}
.chart .grat{stroke:rgba(19,41,75,.1);stroke-width:.6}
#ghost{fill:none;stroke:rgba(19,41,75,.35);stroke-width:1.4;stroke-dasharray:1 5;stroke-linecap:round}
#route{fill:none;stroke:var(--signal);stroke-width:2.6;stroke-linecap:round}
.wp circle.r{fill:var(--paper);stroke:var(--ink);stroke-width:1.6;transition:r .4s var(--ease),fill .4s}
.wp.done circle.r{fill:var(--ink)}
.wp.cur circle.r{fill:var(--signal);stroke:var(--signal)}
.wp circle.pulse{fill:none;stroke:var(--signal);stroke-width:1.2;opacity:0}
.wp.cur circle.pulse{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:22;opacity:0}}
.wp{cursor:pointer}
.wp text{font-size:10px;fill:var(--ink);font-style:italic}
.wp:focus{outline:none}
.wp:focus-visible circle.r{stroke:var(--signal);stroke-width:3}
#ship{transition:opacity .4s}
.legend{position:absolute;left:12px;bottom:10px;font-size:9px;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:#fff;border:1px solid rgba(19,41,75,.15);padding:clamp(18px,3vw,28px);border-radius:4px;position:relative;overflow:hidden;box-shadow:0 18px 40px -24px rgba(19,41,75,.35)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--signal)}
.card .k{font-size:11px;letter-spacing:.24em;color:var(--signal);text-transform:uppercase}
.card h2{font-weight:400;font-size:clamp(26px,3.6vw,38px);line-height:1.05;margin:8px 0 10px}
.card p{font-size:15px;line-height:1.6;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;border-top:1px solid rgba(19,41,75,.12);padding-top:14px}
.stats div{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.stats b{display:block;font-size:20px;letter-spacing:0;color:var(--ink);font-weight:400;font-family:"Iowan Old Style",Palatino,Georgia,serif;margin-top:4px}
.card .in{transition:opacity .45s var(--ease),transform .45s var(--ease)}
.card.swap .in{opacity:0;transform:translateY(10px)}
.tlw{position:relative}
ol.tl{list-style:none;padding-left:0}
.tlw::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:rgba(19,41,75,.14)}
.fill{position:absolute;left:11px;top:14px;width:2px;height:0;background:var(--signal);transition:height 1.1s var(--ease)}
ol.tl li{position:relative}
ol.tl button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:24px 1fr auto;gap:14px;align-items:center;width:100%;padding:10px 8px 10px 0;cursor:pointer;border-radius:4px;transition:background .3s}
ol.tl button:hover{background:rgba(19,41,75,.05)}
ol.tl button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:9px;position:relative;z-index:1;transition:background .4s,border-color .4s,color .4s,transform .4s var(--ease)}
li.done .dot{background:var(--ink);color:var(--paper)}
li.cur .dot{background:var(--signal);border-color:var(--signal);color:#fff;transform:scale(1.15)}
.nm{font-size:17px}
li.cur .nm{font-style:italic}
.dt{font-size:10px;letter-spacing:.12em;color:var(--ink2)}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.ctl button{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:10px 16px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.ctl button:hover,.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctl button:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}header{grid-template-columns:1fr}.tally{text-align:left;display:flex;gap:24px}}
@media (prefers-reduced-motion:reduce){
  .wp.cur circle.pulse{animation:none}
  .fill,.card .in,.dot{transition:none}
}
</style>
</head>
<body>
<header>
  <div>
    <small>Logbook · Northern Archipelago Survey</small>
    <h1>The Voyage of the<br><em>Halcyon Wren</em></h1>
    <p>Four hundred and eleven days, a crew of nineteen, and a single brass chronometer that never lost more than a second a week. Follow the route stop by stop.</p>
  </div>
  <div class="tally mono">
    <span>Distance logged<b id="tNm">0 nm</b></span>
    <span>Day at sea<b id="tDay">1</b></span>
  </div>
</header>
<div class="wrap">
  <figure class="chart">
    <svg id="map" viewBox="0 0 600 420" role="group" aria-label="Chart of the voyage route">
      <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(183,166,132,.5)" stroke-width="1"/></pattern>
      </defs>
      <g class="grat">
        <line x1="0" y1="105" x2="600" y2="105"/><line x1="0" y1="210" x2="600" y2="210"/><line x1="0" y1="315" x2="600" y2="315"/>
        <line x1="150" y1="0" x2="150" y2="420"/><line x1="300" y1="0" x2="300" y2="420"/><line x1="450" y1="0" x2="450" y2="420"/>
      </g>
      <text class="lbl" x="4" y="101">61°N</text><text class="lbl" x="4" y="206">58°N</text><text class="lbl" x="4" y="311">55°N</text>
      <path class="contour" d="M0 380 C80 360 120 395 200 370 S330 330 380 360 S520 410 600 380"/>
      <path class="contour" d="M0 405 C90 390 160 410 230 395 S360 370 420 390 S540 415 600 400"/>
      <path class="contour" d="M440 0 C430 40 470 70 520 60 S590 90 600 70"/>
      <path class="isl" d="M20 340 C40 300 90 300 100 330 S90 400 50 400 S10 370 20 340Z"/>
      <path class="hatchp" d="M20 340 C40 300 90 300 100 330 S90 400 50 400 S10 370 20 340Z"/>
      <path class="isl" d="M160 230 C170 215 195 220 192 238 S168 255 160 230Z"/>
      <path class="isl" d="M236 312 C250 296 280 300 282 318 S256 340 236 312Z"/>
      <path class="isl" d="M318 160 C326 148 340 152 338 164 S322 172 318 160Z M346 170 C352 164 362 168 358 176 S344 178 346 170Z M300 178 C306 172 314 176 311 183 S299 186 300 178Z"/>
      <path class="isl" d="M430 252 C440 236 470 240 466 258 S436 272 430 252Z"/>
      <path class="isl" d="M478 92 C500 70 545 80 540 110 S500 150 486 132 S466 108 478 92Z"/>
      <path class="isl" d="M520 30 C532 18 560 22 566 40 S548 64 532 58 S510 42 520 30Z"/>
      <g transform="translate(540 340)" aria-hidden="true">
        <circle r="34" fill="none" stroke="rgba(19,41,75,.3)"/><circle r="26" fill="none" stroke="rgba(19,41,75,.15)"/>
        <path d="M0 -38 L6 0 L0 38 L-6 0Z" fill="rgba(19,41,75,.55)"/><path d="M-38 0 L0 6 L38 0 L0 -6Z" fill="rgba(19,41,75,.25)"/>
        <text class="lbl" x="-3" y="-42">N</text>
      </g>
      <path id="ghost" d=""/>
      <path id="route" d=""/>
      <g id="wps"></g>
      <g id="ship" aria-hidden="true">
        <path d="M-9 0 L6 -5 L10 0 L6 5Z" fill="#13294b"/>
        <path d="M-4 -2 L2 -2 L-1 -9Z" fill="#e8562a"/>
      </g>
    </svg>
    <div class="legend mono">Scale · 1 grid = 180 nm</div>
  </figure>
  <div class="side">
    <article class="card" id="card" aria-live="polite">
      <div class="in">
        <div class="k mono" id="cK"></div>
        <h2 id="cH"></h2>
        <p id="cP"></p>
        <div class="stats">
          <div>Coordinates<b id="cC" class="mono" style="font-size:13px"></b></div>
          <div>Weather<b id="cW"></b></div>
          <div>Leg<b id="cL"></b></div>
        </div>
      </div>
    </article>
    <div class="ctl">
      <button id="prev" type="button">Previous</button>
      <button id="next" type="button">Next port</button>
      <button id="play" type="button" aria-pressed="false">Sail the route</button>
    </div>
    <div class="tlw"><span class="fill" id="fill"></span><ol class="tl" id="tl"></ol></div>
  </div>
</div>
<script>
(function(){
  var stops=[
    {n:'Port Calder',d:'14 Apr 1871',day:1,p:[70,335],c:'54°12′N 3°40′W',w:'Fair',t:'The Wren slips her moorings at dawn with a hold of salted cod, survey chains, and two hundred jars of lamp oil. The harbourmaster rings the bell nineteen times, once for each soul aboard.'},
    {n:'Sable Reach',d:'02 May 1871',day:19,p:[175,240],c:'56°41′N 1°02′W',w:'Squalls',t:'A black-sand spit where the charts were wrong by eleven miles. The surveyors redraw the coast by lantern light while the ship rides out three days of squalls.'},
    {n:'Mirrow Shoals',d:'29 Jun 1871',day:77,p:[258,296],c:'55°20′N 0°48′E',w:'Glass calm',t:'Water so still the crew could see the sand ripples twelve fathoms down. Soundings here fill an entire ledger, each depth inked in the bosun’s careful hand.'},
    {n:'The Lantern Isles',d:'18 Sep 1871',day:158,p:[330,168],c:'59°05′N 2°11′E',w:'Fog',t:'Three islets where keepers burn whale oil every night of the year. The Wren winters here, trading rope for bread and learning the keepers’ songs.'},
    {n:'Cape Ostrava',d:'04 Mar 1872',day:326,p:[448,252],c:'56°02′N 5°37′E',w:'Gale',t:'Rounding the cape costs the foremast and a week of repairs. The chronometer, wrapped in a wool blanket, keeps time through every roll.'},
    {n:'Tessaly Atoll',d:'11 Apr 1872',day:364,p:[505,112],c:'60°22′N 7°10′E',w:'Clear',t:'A ring of reef around a lagoon of improbable green. Here the expedition sets the last baseline of the survey, one mile of chain laid stake by stake.'},
    {n:'Isle of Quiet Bells',d:'29 May 1872',day:411,p:[540,42],c:'62°48′N 7°55′E',w:'Snow',t:'The northernmost mark on the chart. The captain leaves a brass bell on the summit cairn, engraved with the date and the names of all nineteen.'}
  ];
  var NS='http://www.w3.org/2000/svg';
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var route=document.getElementById('route'),ghost=document.getElementById('ghost'),ship=document.getElementById('ship');
  // Catmull-Rom to cubic segments
  var segs=[],full='M'+stops[0].p.join(' ');
  for(var i=0;i<stops.length-1;i++){
    var p0=stops[Math.max(0,i-1)].p,p1=stops[i].p,p2=stops[i+1].p,p3=stops[Math.min(stops.length-1,i+2)].p;
    var c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    var s=' C'+c1.join(' ')+' '+c2.join(' ')+' '+p2.join(' ');
    segs.push('M'+p1.join(' ')+s);full+=s;
  }
  route.setAttribute('d',full);ghost.setAttribute('d',full);
  var total=route.getTotalLength(),cum=[0],tmp=document.createElementNS(NS,'path');
  segs.forEach(function(sd,i){tmp.setAttribute('d',sd);document.getElementById('map').appendChild(tmp);cum.push(cum[i]+tmp.getTotalLength());tmp.remove()});
  var scale=total/cum[cum.length-1];cum=cum.map(function(v){return v*scale});
  var nmPer=4180/total;
  route.style.strokeDasharray=total;route.style.strokeDashoffset=total;
  // waypoints
  var wpsG=document.getElementById('wps'),wps=[];
  stops.forEach(function(st,i){
    var g=document.createElementNS(NS,'g');g.setAttribute('class','wp');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',st.n+', '+st.d);
    g.setAttribute('transform','translate('+st.p[0]+' '+st.p[1]+')');
    g.innerHTML='<circle class="pulse" r="6"/><circle class="r" r="6"/><text x="'+(st.p[0]>480?-10:10)+'" y="-9" text-anchor="'+(st.p[0]>480?'end':'start')+'">'+st.n+'</text>';
    g.addEventListener('click',function(){go(i)});
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i)}});
    wpsG.appendChild(g);wps.push(g);
  });
  // timeline list
  var tl=document.getElementById('tl'),items=[];
  stops.forEach(function(st,i){
    var li=document.createElement('li');
    li.innerHTML='<button type="button"><span class="dot mono">'+(i+1)+'</span><span class="nm">'+st.n+'</span><span class="dt mono">DAY '+st.day+'</span></button>';
    li.querySelector('button').addEventListener('click',function(){go(i)});
    tl.appendChild(li);items.push(li);
  });
  var fill=document.getElementById('fill');
  var card=document.getElementById('card'),tNm=document.getElementById('tNm'),tDay=document.getElementById('tDay');
  var cur=-1,len=0,anim=null;
  function placeShip(L){
    L=Math.max(0,Math.min(total,L));
    var a=route.getPointAtLength(L),b=route.getPointAtLength(Math.min(total,L+1)),c=route.getPointAtLength(Math.max(0,L-1));
    var ang=Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI;
    ship.setAttribute('transform','translate('+a.x+' '+a.y+') rotate('+ang+')');
    route.style.strokeDashoffset=total-L;
    tNm.textContent=Math.round(L*nmPer).toLocaleString('en-US')+' nm';
  }
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
  function go(i){
    if(i===cur)return;
    var from=len,to=cum[i],d0=cur<0?1:stops[cur].day,d1=stops[i].day;
    cur=i;
    wps.forEach(function(w,k){w.setAttribute('class','wp'+(k<i?' done':'')+(k===i?' cur':''))});
    items.forEach(function(li,k){li.className=(k<i?'done':'')+(k===i?' cur':'')});
    fill.style.height=(items[i].offsetTop-items[0].offsetTop)+'px';
    card.classList.add('swap');
    setTimeout(function(){
      var st=stops[i];
      document.getElementById('cK').textContent='Stop '+(i+1)+' of '+stops.length+' · '+st.d;
      document.getElementById('cH').textContent=st.n;
      document.getElementById('cP').textContent=st.t;
      document.getElementById('cC').textContent=st.c;
      document.getElementById('cW').textContent=st.w;
      document.getElementById('cL').textContent=i?Math.round((cum[i]-cum[i-1])*nmPer)+' nm':'Origin';
      card.classList.remove('swap');
    },reduced?0:220);
    var dur=reduced?1:Math.min(1800,500+Math.abs(to-from)*3),t0=performance.now();
    if(anim)cancelAnimationFrame(anim);
    function stepA(now){
      var k=Math.min(1,(now-t0)/dur),e=ease(k);
      len=from+(to-from)*e;placeShip(len);
      tDay.textContent=Math.round(d0+(d1-d0)*e);
      if(k<1)anim=requestAnimationFrame(stepA);
    }
    anim=requestAnimationFrame(stepA);
  }
  document.getElementById('prev').addEventListener('click',function(){go(Math.max(0,cur-1))});
  document.getElementById('next').addEventListener('click',function(){go(Math.min(stops.length-1,cur+1))});
  var playBtn=document.getElementById('play'),timer=null;
  playBtn.addEventListener('click',function(){
    if(timer){clearInterval(timer);timer=null;playBtn.setAttribute('aria-pressed','false');playBtn.textContent='Sail the route';return}
    if(cur===stops.length-1)go(0);
    playBtn.setAttribute('aria-pressed','true');playBtn.textContent='Drop anchor';
    timer=setInterval(function(){
      if(cur>=stops.length-1){clearInterval(timer);timer=null;playBtn.setAttribute('aria-pressed','false');playBtn.textContent='Sail the route';return}
      go(cur+1);
    },2400);
  });
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('.wp'))return;
    if(e.key==='ArrowRight'){go(Math.min(stops.length-1,cur+1))}
    if(e.key==='ArrowLeft'){go(Math.max(0,cur-1))}
  });
  window.addEventListener('resize',function(){fill.style.height=(items[cur].offsetTop-items[0].offsetTop)+'px'});
  go(0);placeShip(0);
})();
</script>
</body>
</html>
