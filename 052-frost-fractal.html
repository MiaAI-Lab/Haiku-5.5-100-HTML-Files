<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rime: A Frost Study</title>
<style>
:root{
  --night:#050d19;--deep:#0b1d33;--steel:#2b4a6b;--frost:#eaf7ff;--cyan:#9fd6f0;--lilac:#b9b6ff;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --breath:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(60% 50% at 70% 30%,rgba(120,150,255,.18),transparent 70%),
    radial-gradient(80% 70% at 20% 90%,rgba(60,140,190,.22),transparent 70%),
    linear-gradient(170deg,var(--deep),var(--night) 70%);
  color:var(--frost);font-family:var(--sans);
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.window-frame{position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 10px rgba(8,18,32,.9),inset 0 0 0 11px rgba(159,214,240,.15),inset 0 0 160px rgba(0,0,0,.6)}
.plate{
  position:fixed;left:clamp(16px,4vw,48px);bottom:clamp(16px,4vw,48px);max-width:min(360px,calc(100vw - 32px));
  padding:22px 24px 20px;border-radius:4px;
  background:linear-gradient(160deg,rgba(234,247,255,.10),rgba(234,247,255,.03));
  border:1px solid rgba(234,247,255,.18);
  backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.7);
  opacity:0;transform:translateY(14px);animation:rise 1.4s cubic-bezier(.16,1,.3,1) .5s forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--cyan)}
h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(38px,7vw,56px);line-height:1;margin:10px 0 8px;letter-spacing:-.01em}
.plate p{font-family:var(--serif);font-size:15px;line-height:1.55;color:rgba(234,247,255,.78)}
.row{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.lung{width:30px;height:30px;border-radius:50%;border:1px solid rgba(159,214,240,.55);position:relative;flex:none}
.lung::after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,var(--frost),rgba(159,214,240,.2));
  transform:scale(calc(.45 + var(--breath)*.55));transition:transform .1s linear}
.phase{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);min-width:64px}
button{
  font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--frost);
  background:transparent;border:1px solid rgba(234,247,255,.3);padding:8px 12px;border-radius:999px;cursor:pointer;
  transition:background .3s cubic-bezier(.2,.8,.2,1),border-color .3s,color .3s;
}
button:hover{background:rgba(234,247,255,.12);border-color:var(--frost)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.hint{position:fixed;top:clamp(16px,4vw,40px);right:clamp(16px,4vw,48px);text-align:right;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(234,247,255,.6);line-height:2;pointer-events:none}
.hint span{display:block}
.count{font-variant-numeric:tabular-nums;color:var(--frost)}
@media (max-width:520px){.hint{left:16px;right:16px;text-align:left}.plate{padding:18px}}
@media (prefers-reduced-motion:reduce){.plate{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Frost crystals growing across a dark window pane"></canvas>
<div class="window-frame"></div>
<div class="hint"><span>Tap to seed a crystal</span><span>Drag to write on the glass</span><span><b class="count" id="count">0</b> branches growing</span></div>
<section class="plate">
  <div class="eyebrow">Hoarfrost study · No. 4</div>
  <h1>Rime</h1>
  <p>Before dawn the pane forgets it is transparent. Water finds the cold, and the cold answers in ferns, needles and six-fold stars. Breathe on it and it remembers.</p>
  <div class="row">
    <span class="lung" aria-hidden="true"></span><span class="phase" id="phase">inhale</span>
    <button type="button" id="thaw">Thaw</button>
    <button type="button" id="freeze">Freeze edges</button>
  </div>
</section>
<script>
(function(){
  var c=document.getElementById('c'),ctx=c.getContext('2d');
  var frost=document.createElement('canvas'),fx=frost.getContext('2d');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root=document.documentElement,phaseEl=document.getElementById('phase'),countEl=document.getElementById('count');
  var dpr=1,W=0,H=0,branches=[],MAX=900;

  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    var nw=Math.floor(innerWidth*dpr),nh=Math.floor(innerHeight*dpr);
    var old=null;
    if(frost.width){old=document.createElement('canvas');old.width=frost.width;old.height=frost.height;old.getContext('2d').drawImage(frost,0,0)}
    c.width=frost.width=nw;c.height=frost.height=nh;W=nw;H=nh;
    if(old)fx.drawImage(old,0,0,nw,nh);
  }

  function addBranch(x,y,a,len,depth){
    if(branches.length>=MAX)return;
    branches.push({x:x,y:y,a:a,len:0,max:len,d:depth,curl:(Math.random()-.5)*0.02});
  }
  function seed(x,y,a){
    var arms=a===undefined?6:3,base=a===undefined?Math.random()*Math.PI:a-Math.PI/3;
    var reach=(110+Math.random()*160)*dpr;
    for(var k=0;k<arms;k++){addBranch(x,y,base+k*(a===undefined?Math.PI/3:Math.PI/3),reach*(0.75+Math.random()*.5),0)}
  }
  function seedEdges(){
    var n=Math.max(8,Math.round((W+H)/(160*dpr)));
    for(var i=0;i<n;i++){
      var s=Math.floor(Math.random()*4),x,y,a;
      if(s===0){x=Math.random()*W;y=0;a=Math.PI/2}
      else if(s===1){x=W;y=Math.random()*H;a=Math.PI}
      else if(s===2){x=Math.random()*W;y=H;a=-Math.PI/2}
      else{x=0;y=Math.random()*H;a=0}
      seed(x,y,a+(Math.random()-.5)*.6);
    }
  }

  function grow(steps){
    var step=1.6*dpr;
    for(var s=0;s<steps;s++){
      for(var i=branches.length-1;i>=0;i--){
        var b=branches[i];
        var nx=b.x+Math.cos(b.a)*step,ny=b.y+Math.sin(b.a)*step;
        var w=Math.max(.45,1.7-b.d*.38)*dpr;
        var life=1-b.len/b.max;
        fx.strokeStyle='rgba(159,214,240,'+(0.08*life+0.03)+')';fx.lineWidth=w*3.2;
        fx.beginPath();fx.moveTo(b.x,b.y);fx.lineTo(nx,ny);fx.stroke();
        fx.strokeStyle='rgba(234,247,255,'+(0.35+0.45*life)+')';fx.lineWidth=w;
        fx.beginPath();fx.moveTo(b.x,b.y);fx.lineTo(nx,ny);fx.stroke();
        b.x=nx;b.y=ny;b.len+=step;b.a+=b.curl+(Math.random()-.5)*0.05;
        if(b.d<4&&Math.random()<0.055-b.d*0.008){
          var rem=(b.max-b.len)*(0.35+Math.random()*.3);
          if(rem>6*dpr){var side=Math.random()<.5?1:-1;addBranch(b.x,b.y,b.a+side*Math.PI/3,rem,b.d+1);
            if(Math.random()<.4)addBranch(b.x,b.y,b.a-side*Math.PI/3,rem*.8,b.d+1)}
        }
        if(b.len>=b.max||nx<-20||ny<-20||nx>W+20||ny>H+20){
          if(b.d>=2&&Math.random()<.25)star(b.x,b.y,(2+Math.random()*3)*dpr);
          branches.splice(i,1);
        }
      }
    }
  }
  function star(x,y,r){
    fx.strokeStyle='rgba(234,247,255,.7)';fx.lineWidth=.6*dpr;fx.beginPath();
    for(var k=0;k<3;k++){var a=k*Math.PI/3;fx.moveTo(x-Math.cos(a)*r,y-Math.sin(a)*r);fx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}
    fx.stroke();
  }

  function melt(x,y,r){
    fx.save();fx.globalCompositeOperation='destination-out';
    var g=fx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');
    fx.fillStyle=g;fx.beginPath();fx.arc(x,y,r,0,7);fx.fill();fx.restore();
  }

  var down=null,lastP=null;
  c.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY,moved:false};lastP=down;c.setPointerCapture(e.pointerId)});
  c.addEventListener('pointermove',function(e){
    if(!down)return;
    if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)down.moved=true;
    if(down.moved){
      var dx=e.clientX-lastP.x,dy=e.clientY-lastP.y,d=Math.hypot(dx,dy),n=Math.max(1,Math.ceil(d/6));
      for(var k=1;k<=n;k++)melt((lastP.x+dx*k/n)*dpr,(lastP.y+dy*k/n)*dpr,26*dpr);
      lastP={x:e.clientX,y:e.clientY};
    }
  });
  function up(e){if(down&&!down.moved){seed(e.clientX*dpr,e.clientY*dpr);if(reduce)grow(400)}down=null}
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',function(){down=null});

  document.getElementById('thaw').addEventListener('click',function(){thawT=1});
  document.getElementById('freeze').addEventListener('click',function(){seedEdges();if(reduce)grow(500)});

  var thawT=0,t0=performance.now(),lastPhase='';
  function loop(now){
    var t=(now-t0)/1000;
    var br=reduce?0.5:(Math.sin(t*Math.PI*2/6.5-Math.PI/2)+1)/2;
    root.style.setProperty('--breath',br.toFixed(3));
    var ph=reduce?'still':(Math.cos(t*Math.PI*2/6.5-Math.PI/2)>0?'inhale':'exhale');
    if(ph!==lastPhase){phaseEl.textContent=ph;lastPhase=ph}
    if(!reduce)grow(3);
    if(thawT>0){fx.save();fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.08)';fx.fillRect(0,0,W,H);fx.restore();thawT-=0.02;if(thawT<=0){thawT=0;fx.clearRect(0,0,W,H);seedEdges();if(reduce)grow(500)}}
    ctx.clearRect(0,0,W,H);
    ctx.globalAlpha=0.72+0.28*br;ctx.drawImage(frost,0,0);ctx.globalAlpha=1;
    var g=ctx.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,Math.max(W,H)*.7);
    g.addColorStop(0,'rgba(185,182,255,'+(0.02+0.07*br)+')');g.addColorStop(.6,'rgba(159,214,240,'+(0.03*br)+')');g.addColorStop(1,'rgba(5,13,25,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    countEl.textContent=branches.length;
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize',resize);
  resize();seedEdges();
  if(reduce)grow(900);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
