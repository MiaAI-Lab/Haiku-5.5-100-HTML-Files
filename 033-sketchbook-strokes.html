<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Hollow Sketchbook</title>
<style>
:root{--desk:#2b312e;--paper:#f7f1e2;--paper2:#efe6d0;--rule:rgba(74,116,186,.26);--margin:rgba(205,72,66,.5);--graphite:#3b3b3e;--soft:#8a8a8c;--terra:#c4623f;--sage:#6f9161;--ochre:#d1972a;--cobalt:#3c5aa8;--acc:#d1972a;--hand:"Bradley Hand","Segoe Print","Chalkboard SE","Noteworthy","Comic Sans MS",cursive;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--desk)}
body{min-height:100vh;font-family:Georgia,"Iowan Old Style",serif;color:var(--graphite);overflow-x:hidden;background:radial-gradient(ellipse 80% 60% at 40% 30%,rgba(255,240,210,.12),transparent 70%),radial-gradient(circle at 20% 80%,rgba(0,0,0,.25),transparent 50%),var(--desk);display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,56px) 16px}
.book{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);width:min(1080px,100%);transform:rotate(-.6deg);filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)) drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.page{position:relative;background:linear-gradient(90deg,transparent 54px,var(--margin) 54px 56px,transparent 56px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px),radial-gradient(circle at 30% 20%,rgba(255,255,255,.6),transparent 60%),var(--paper);background-position:0 0,0 64px,0 0,0 0;background-size:auto,100% calc(100% - 64px),auto,auto;background-repeat:no-repeat;padding:32px 28px 32px 76px;min-height:640px}
.page.left{border-radius:6px 2px 2px 6px;box-shadow:inset -18px 0 24px -18px rgba(60,40,10,.35)}
.page.right{border-radius:2px 6px 6px 2px;box-shadow:inset 18px 0 24px -18px rgba(60,40,10,.35)}
.spiral{background:linear-gradient(90deg,var(--paper2),#e2d7bd 50%,var(--paper2));position:relative}
.spiral::before{content:"";position:absolute;left:3px;right:3px;top:16px;bottom:16px;background:radial-gradient(ellipse 15px 6px at 50% 50%,transparent 9px,#6c6c70 10px,#b9b9bd 12px,#58585c 14px,transparent 15px) 0 0/100% 32px repeat-y}
.stamp{font:700 11px/32px "Courier New",ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);display:flex;justify-content:space-between}
h1{font:400 clamp(30px,4vw,42px)/64px var(--hand);color:var(--graphite);letter-spacing:-.01em}
.sketch{position:relative;margin:0 0 0 -40px;width:calc(100% + 40px)}
svg.art{display:block;width:100%;height:auto;max-height:420px;overflow:visible}
#strokes path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#strokes .g{stroke:var(--graphite);stroke-width:2.3}
#strokes .l{stroke:var(--soft);stroke-width:1.1;opacity:.6}
#strokes .a{stroke:var(--acc);stroke-width:2.4}
#hatchFill{opacity:0;transition:opacity 1.1s ease}
.filled #hatchFill{opacity:.85}
#pencil{transition:opacity .35s ease}
#pencil.off{opacity:0}
.sketch.fade svg.art{opacity:0;transform:translateY(6px) rotate(-1deg);filter:blur(2px)}
svg.art{transition:opacity .35s ease,transform .45s var(--ease),filter .35s ease}
.controls{display:flex;align-items:center;gap:16px;height:64px}
.btn{font:400 18px/1 var(--hand);color:var(--graphite);background:none;border:0;padding:6px 4px;cursor:pointer;position:relative}
.btn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--acc);transform:scaleX(.25);transform-origin:left;transition:transform .4s var(--ease);border-radius:2px}
.btn:hover::after,.btn:focus-visible::after{transform:scaleX(1)}
.btn:focus-visible{outline:none}
.scrub{flex:1;display:flex;align-items:center;gap:10px;font:700 10px/1 "Courier New",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--graphite) 0 6px,transparent 6px 9px)}
input[type=range]::-moz-range-track{height:3px;background:repeating-linear-gradient(90deg,var(--graphite) 0 6px,transparent 6px 9px)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:22px;margin-top:-10px;border-radius:2px 2px 6px 6px;background:linear-gradient(180deg,#f1a3a3 0 22%,#b7b7bb 22% 34%,var(--acc) 34%);box-shadow:0 2px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:12px;height:22px;border:0;border-radius:2px 2px 6px 6px;background:linear-gradient(180deg,#f1a3a3 0 22%,#b7b7bb 22% 34%,var(--acc) 34%)}
input[type=range]:focus-visible{outline:1px dashed var(--acc);outline-offset:4px}
.notes h2{font:400 clamp(26px,3.2vw,34px)/64px var(--hand);position:relative;display:inline-block}
.notes h2 svg{position:absolute;left:-4px;bottom:10px;width:calc(100% + 8px);height:12px;overflow:visible}
.notes h2 path{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;transition:stroke-dashoffset .9s var(--ease) .1s}
.notes.show h2 path{stroke-dashoffset:0}
.notes ul{list-style:none}
.notes li{font:400 clamp(17px,2vw,21px)/32px var(--hand);color:#2f3a5a;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.4,0,.6,1);transition-delay:calc(var(--i) * .7s + .4s)}
.notes.show li{clip-path:inset(0 0 0 0)}
.cap{margin-top:32px;font:italic 14px/32px Georgia,serif;color:#6b6250}
.swatches{display:flex;gap:14px;align-items:center;height:64px}
.sw{width:46px;height:10px;border-radius:10px 2px 2px 10px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw::before{content:"";position:absolute;left:-9px;top:0;border:5px solid transparent;border-right:9px solid #e8cfa6;border-left:0}
.margin-doodle{position:absolute;right:26px;bottom:34px;width:110px;opacity:.75}
.margin-doodle path{fill:none;stroke:var(--soft);stroke-width:1.4;stroke-linecap:round}
.tabs{position:absolute;right:-46px;top:64px;display:flex;flex-direction:column;gap:10px}
.tab{width:48px;height:92px;border:0;border-radius:0 8px 8px 0;cursor:pointer;font:400 15px/1 var(--hand);color:#fff;writing-mode:vertical-rl;text-orientation:mixed;transform:translateX(-10px);transition:transform .35s var(--ease),filter .3s;box-shadow:2px 3px 6px rgba(0,0,0,.25);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.tab:hover,.tab:focus-visible{transform:translateX(-2px);outline:none;filter:brightness(1.08)}
.tab[aria-selected=true]{transform:translateX(0)}
.t0{background:var(--ochre)}.t1{background:var(--terra)}.t2{background:var(--sage)}.t3{background:var(--cobalt)}
@media (max-width:820px){
  .book{grid-template-columns:minmax(0,1fr);transform:none}
  .spiral{height:30px}
  .spiral::before{left:16px;right:16px;top:3px;bottom:3px;background:radial-gradient(ellipse 6px 13px at 50% 50%,transparent 8px,#6c6c70 9px,#b9b9bd 11px,#58585c 12px,transparent 13px) 0 0/32px 100% repeat-x}
  .page{min-height:0;padding:32px 18px 32px 52px;background:linear-gradient(90deg,transparent 36px,var(--margin) 36px 38px,transparent 38px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px),var(--paper);background-position:0 0,0 64px,0 0;background-size:auto,100% calc(100% - 64px),auto;background-repeat:no-repeat}
  .page.left,.page.right{border-radius:6px;box-shadow:none}
  .sketch{margin-left:-30px;width:calc(100% + 30px)}
  .tabs{position:static;flex-direction:row;grid-row:1;margin:0 0 -2px 12px;gap:6px}
  .tab{writing-mode:horizontal-tb;width:auto;height:40px;padding:0 14px;border-radius:8px 8px 0 0;transform:translateY(8px)}
  .tab:hover,.tab:focus-visible{transform:translateY(3px)}
  .tab[aria-selected=true]{transform:none}
  .margin-doodle{display:none}
}
@media (prefers-reduced-motion:reduce){.notes li,.notes h2 path,svg.art,#hatchFill{transition:none}}
</style>
</head>
<body>
<main class="book" id="book">
  <nav class="tabs" role="tablist" aria-label="Sketches">
    <button class="tab t0" role="tab" type="button" aria-selected="true" data-i="0">Teapot</button>
    <button class="tab t1" role="tab" type="button" aria-selected="false" data-i="1">Lighthouse</button>
    <button class="tab t2" role="tab" type="button" aria-selected="false" data-i="2">Fern</button>
    <button class="tab t3" role="tab" type="button" aria-selected="false" data-i="3">Bicycle</button>
  </nav>
  <section class="page left">
    <p class="stamp"><span>Wren Hollow</span><span id="plate">No. 01</span></p>
    <h1>Things that stayed still</h1>
    <div class="sketch" id="sketch">
      <svg class="art" id="art" viewBox="0 0 400 400" role="img" aria-labelledby="artTitle">
        <title id="artTitle">Pencil sketch</title>
        <defs>
          <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
            <line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--acc)" stroke-width="2.4" opacity=".55"></line>
          </pattern>
          <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="4"></feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="1.8"></feDisplacementMap>
          </filter>
        </defs>
        <g id="hatchFill"></g>
        <g id="strokes" filter="url(#rough)"></g>
        <g id="pencil" class="off">
          <g transform="rotate(-40)">
            <path d="M0 0 L14 -5 L14 5 Z" fill="#ecd2a8"></path>
            <path d="M0 0 L5 -1.8 L5 1.8 Z" fill="#2d2d30"></path>
            <rect x="14" y="-5" width="62" height="10" style="fill:var(--acc)"></rect>
            <rect x="14" y="-1" width="62" height="2" fill="#000" opacity=".12"></rect>
            <rect x="76" y="-5.5" width="9" height="11" fill="#bdbdc2"></rect>
            <rect x="85" y="-5" width="9" height="10" rx="2" fill="#ef9ea0"></rect>
          </g>
        </g>
      </svg>
    </div>
    <div class="controls">
      <button class="btn" id="redraw" type="button">Redraw</button>
      <label class="scrub" for="scrub">Scrub <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Drawing progress"></label>
    </div>
  </section>
  <div class="spiral" aria-hidden="true"></div>
  <section class="page right">
    <p class="stamp"><span id="date">Tuesday, early</span><span>Field notes</span></p>
    <div class="notes" id="notes" aria-live="polite">
      <h2><span id="nTitle"></span><svg viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C 60 2, 120 11, 180 6 S 270 3, 298 7"></path></svg></h2>
      <ul id="nList"></ul>
      <p class="cap" id="nCap"></p>
    </div>
    <div class="swatches" aria-hidden="true"><span class="sw" style="background:var(--graphite)"></span><span class="sw" id="swAcc" style="background:var(--acc)"></span></div>
    <svg class="margin-doodle" viewBox="0 0 110 60" aria-hidden="true"><path d="M8 40 C 20 10, 40 10, 44 30 C 48 48, 70 50, 76 30 M 70 22 L 78 30 L 86 22"></path><path d="M90 48 C 96 44, 102 46, 104 52"></path></svg>
  </section>
</main>
<script>
(function(){
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';
  var SK = [
    {name:'Teapot', acc:'#d1972a', date:'Tuesday, early', title:"Grandmother's teapot",
     notes:['Chipped at the spout since 1962.','Steeps everything a little too long,','and nobody has ever complained.'], cap:'Plate 01 · 2B graphite, ochre pencil',
     fill:['M110 250 C 100 190, 150 150, 200 150 C 250 150, 300 190, 290 250 C 285 290, 250 305, 200 305 C 150 305, 115 290, 110 250 Z'],
     s:[['g','M110 250 C 100 190, 150 150, 200 150 C 250 150, 300 190, 290 250 C 285 290, 250 305, 200 305 C 150 305, 115 290, 110 250'],
        ['l','M113 246 C 106 194, 152 156, 202 154 C 252 155, 296 194, 287 252'],
        ['g','M150 154 C 160 128, 240 128, 250 154'],
        ['g','M190 134 C 186 116, 214 116, 210 134'],
        ['g','M114 232 C 86 226, 72 200, 56 168 C 64 165, 72 168, 79 175 C 90 194, 100 204, 118 208'],
        ['g','M286 198 C 334 188, 344 262, 290 270'],
        ['l','M288 214 C 318 211, 318 248, 290 252'],
        ['g','M120 240 C 170 256, 230 256, 282 240'],
        ['g','M160 304 C 160 316, 240 316, 240 304'],
        ['a','M197 112 C 186 96, 212 86, 199 68 C 190 58, 206 50, 201 38'],
        ['a','M222 118 C 214 106, 232 98, 224 84'],
        ['l','M60 318 C 140 326, 260 326, 340 318']]},
    {name:'Lighthouse', acc:'#c4623f', date:'Thursday, dusk', title:'Keeper’s light, Wren Point',
     notes:['Drawn from the harbour wall at dusk.','Two sweeps every eleven seconds,','counted on fingers, then on breath.'], cap:'Plate 02 · HB graphite, terracotta pencil',
     fill:['M181 205 L 239 205 L 244 260 L 176 260 Z','M185 140 L 235 140 L 235 105 L 185 105 Z'],
     s:[['g','M170 330 L 185 150 L 235 150 L 250 330'],
        ['g','M172 140 L 248 140 L 248 150 L 172 150 Z'],
        ['g','M185 140 L 185 105 L 235 105 L 235 140'],
        ['l','M210 105 L 210 140 M 185 122 L 235 122'],
        ['g','M178 105 L 210 78 L 242 105 Z'],
        ['g','M210 78 L 210 66'],
        ['g','M181 205 L 239 205 M 176 260 L 244 260'],
        ['g','M200 330 L 200 302 C 200 290, 220 290, 220 302 L 220 330'],
        ['g','M84 332 C 116 312, 150 318, 170 330 L 250 330 C 282 316, 310 322, 334 336'],
        ['l','M60 360 C 80 350, 100 370, 120 360 C 140 350, 160 370, 180 360 C 200 350, 220 370, 240 360 C 260 350, 280 370, 300 360 C 320 350, 336 366, 346 360'],
        ['a','M238 112 L 362 82 M 238 130 L 362 156'],
        ['a','M182 112 L 58 86 M 182 130 L 58 152'],
        ['g','M296 52 C 302 44, 309 44, 313 52 C 317 44, 324 44, 330 52'],
        ['l','M120 40 C 124 34, 129 34, 132 40 C 135 34, 140 34, 144 40']]},
    {name:'Fern', acc:'#6f9161', date:'Saturday, after rain', title:'Unfurling fern',
     notes:['Found under the bridge after rain.','Each frond is a smaller copy of the','whole, folding out of itself.'], cap:'Plate 03 · 4B graphite, sage pencil',
     fill:['M196 320 C170 316,140 302,122 286 C148 292,174 302,196 312 Z','M196 296 C222 290,252 276,268 258 C246 270,222 280,196 288 Z','M194 270 C172 265,148 252,134 238 C156 244,176 254,194 262 Z','M196 246 C218 240,242 228,256 212 C238 224,218 232,196 238 Z','M198 220 C180 214,160 204,150 190 C168 196,184 204,198 212 Z','M202 196 C220 190,238 180,248 166 C234 176,218 184,202 188 Z','M206 170 C192 164,178 156,172 144 C184 150,196 156,206 162 Z','M212 148 C226 142,238 134,242 122 C232 130,222 136,212 140 Z'],
     s:[['g','M200 362 C 195 300, 190 220, 210 150 C 222 110, 240 86, 230 62 C 226 50, 212 52, 216 63 C 219 70, 228 68, 226 62'],
        ['g','M196 320 C170 316,140 302,122 286 C148 292,174 302,196 312'],
        ['g','M196 296 C222 290,252 276,268 258 C246 270,222 280,196 288'],
        ['g','M194 270 C172 265,148 252,134 238 C156 244,176 254,194 262'],
        ['g','M196 246 C218 240,242 228,256 212 C238 224,218 232,196 238'],
        ['g','M198 220 C180 214,160 204,150 190 C168 196,184 204,198 212'],
        ['g','M202 196 C220 190,238 180,248 166 C234 176,218 184,202 188'],
        ['g','M206 170 C192 164,178 156,172 144 C184 150,196 156,206 162'],
        ['g','M212 148 C226 142,238 134,242 122 C232 130,222 136,212 140'],
        ['l','M196 316 L 140 294 M 197 292 L 252 270 M 194 266 L 148 246 M 197 242 L 240 222'],
        ['a','M268 330 C 268 320, 286 320, 286 330 C 286 340, 268 340, 268 330 M 277 321 L 277 339'],
        ['l','M120 362 C 170 356, 240 358, 300 364']]},
    {name:'Bicycle', acc:'#3c5aa8', date:'Monday, before nine', title:'The blue bicycle',
     notes:['Leans on the bakery fence every morning.','Basket of marigolds, bell that sticks,','back tyre always a little soft.'], cap:'Plate 04 · 2H graphite, cobalt pencil',
     fill:['M120 280 L 195 285 L 170 195 Z','M170 195 L 265 192 L 195 285 Z'],
     s:[['g','M58 280 a62 62 0 1 0 124 0 a62 62 0 1 0 -124 0'],
        ['g','M228 280 a62 62 0 1 0 124 0 a62 62 0 1 0 -124 0'],
        ['l','M120 222 L 120 338 M 62 280 L 178 280 M 290 222 L 290 338 M 232 280 L 348 280'],
        ['a','M120 280 L 195 285 L 170 195 Z M 170 195 L 265 192 L 195 285'],
        ['g','M265 192 L 272 215 L 290 280'],
        ['g','M170 195 L 172 182 M 152 182 C 164 175, 186 175, 194 182'],
        ['g','M265 192 L 262 172 C 270 160, 290 162, 296 172'],
        ['g','M187 285 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M 195 285 L 208 300 M 202 300 L 216 300'],
        ['g','M290 165 L 330 165 L 324 192 L 296 192 Z'],
        ['l','M298 172 L 326 172 M 297 182 L 325 182'],
        ['a','M302 162 C 298 150, 312 148, 308 160 M 316 162 C 316 148, 330 150, 322 162'],
        ['l','M36 346 C 140 340, 260 350, 372 343']]}
  ];

  var art = document.getElementById('art'), strokesG = document.getElementById('strokes'), hatchG = document.getElementById('hatchFill');
  var pencil = document.getElementById('pencil'), sketch = document.getElementById('sketch'), scrub = document.getElementById('scrub');
  var notes = document.getElementById('notes'), nTitle = document.getElementById('nTitle'), nList = document.getElementById('nList'), nCap = document.getElementById('nCap');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var items = [], total = 0, T = 0, playing = false, cur = 0, busy = false;
  var SPEED = 300, LIFT = .14;

  function ease(t){ return -(Math.cos(Math.PI * t) - 1) / 2; }

  function build(i){
    var d = SK[i]; cur = i;
    document.documentElement.style.setProperty('--acc', d.acc);
    document.getElementById('artTitle').textContent = 'Pencil sketch of a ' + d.name.toLowerCase();
    document.getElementById('plate').textContent = 'No. 0' + (i + 1);
    document.getElementById('date').textContent = d.date;
    strokesG.textContent = ''; hatchG.textContent = ''; items = []; total = 0;
    d.fill.forEach(function(f){ var p = document.createElementNS(NS, 'path'); p.setAttribute('d', f); p.setAttribute('fill', 'url(#hatch)'); hatchG.appendChild(p); });
    d.s.forEach(function(s){
      var p = document.createElementNS(NS, 'path'); p.setAttribute('d', s[1]); p.setAttribute('class', s[0]);
      strokesG.appendChild(p);
      var len = p.getTotalLength();
      p.style.strokeDasharray = len + ' ' + (len + 2);
      p.style.strokeDashoffset = len;
      var dur = Math.max(.2, len / SPEED);
      items.push({p:p, len:len, s:total, d:dur}); total += dur + LIFT;
    });
    nTitle.textContent = d.title; nList.textContent = '';
    d.notes.forEach(function(n, k){ var li = document.createElement('li'); li.textContent = n; li.style.setProperty('--i', k); nList.appendChild(li); });
    nCap.textContent = d.cap;
    notes.classList.remove('show'); art.classList.remove('filled');
    tabs.forEach(function(t, k){ t.setAttribute('aria-selected', k === i ? 'true' : 'false'); t.tabIndex = k === i ? 0 : -1; });
  }

  function setT(t){
    T = Math.max(0, Math.min(total, t));
    var tip = null;
    for(var i = 0; i < items.length; i++){
      var it = items[i], local = (T - it.s) / it.d;
      local = local < 0 ? 0 : local > 1 ? 1 : local;
      var e = ease(local);
      it.p.style.strokeDashoffset = (it.len * (1 - e)).toFixed(2);
      if(T >= it.s) tip = {it:it, e:e};
    }
    if(tip){
      var pt = tip.it.p.getPointAtLength(tip.it.len * tip.e);
      pencil.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1) + ')');
    }
    var done = T >= total - .001;
    art.classList.toggle('filled', done);
    notes.classList.toggle('show', done);
    pencil.classList.toggle('off', done || T <= 0);
    scrub.value = Math.round(T / total * 1000);
  }

  var last = 0;
  function loop(now){
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    if(playing){ setT(T + dt); if(T >= total) playing = false; }
    if(playing) requestAnimationFrame(loop);
  }
  function play(from){
    if(RM){ setT(total); return; }
    setT(from || 0); playing = true; last = performance.now(); requestAnimationFrame(loop);
  }

  function go(i){
    if(busy || (i === cur && T > 0)) { if(i === cur) play(0); return; }
    busy = true; playing = false;
    sketch.classList.add('fade');
    setTimeout(function(){
      build(i); setT(0); sketch.classList.remove('fade');
      setTimeout(function(){ busy = false; play(0); }, RM ? 0 : 280);
    }, RM ? 0 : 340);
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ go(+t.dataset.i); });
    t.addEventListener('keydown', function(e){
      var k = e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 0;
      if(!k) return; e.preventDefault();
      var n = (cur + k + tabs.length) % tabs.length; tabs[n].focus(); go(n);
    });
  });
  document.getElementById('redraw').addEventListener('click', function(){ play(0); });
  scrub.addEventListener('input', function(){ playing = false; setT(scrub.value / 1000 * total); });

  build(0); setT(0);
  setTimeout(function(){ play(0); }, RM ? 0 : 500);
})();
</script>
</body>
</html>
