<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaisekitei — A Raked Sand Garden</title>
<style>
:root{
  --sand:#d8ccb4;
  --ink:#2f2c27;
  --soft:#6f6658;
  --moss:#5f6e45;
  --wood:#3b2f25;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--wood);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.garden{position:fixed;inset:clamp(8px,1.6vw,18px);border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.06),0 30px 60px rgba(0,0,0,.45)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.title{
  position:absolute;left:clamp(16px,3vw,40px);top:clamp(16px,3vw,36px);pointer-events:none;
  display:flex;gap:16px;align-items:flex-start;
}
.title .v{
  writing-mode:vertical-rl;font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  font-size:clamp(22px,3.4vw,38px);letter-spacing:.35em;color:var(--ink);line-height:1;
}
.title p{max-width:220px;font-family:Georgia,"Iowan Old Style",serif;font-size:14px;line-height:1.6;color:var(--soft);margin-top:4px}
.title p b{display:block;font-family:system-ui,sans-serif;font-weight:600;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}
.seal{width:28px;height:28px;border-radius:4px;background:#a8402f;color:#f3e8d8;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:13px;margin-top:10px;box-shadow:inset 0 0 0 2px rgba(243,232,216,.35)}
.tools{
  position:absolute;right:clamp(12px,2.4vw,32px);bottom:clamp(12px,2.4vw,32px);
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;
  padding:6px;border-radius:999px;background:rgba(244,238,226,.72);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(60,45,30,.18),inset 0 0 0 1px rgba(255,255,255,.5);
}
.tools span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);padding:0 6px 0 10px}
.tools button{
  appearance:none;border:0;cursor:pointer;font:inherit;font-size:12px;color:var(--ink);
  background:transparent;border-radius:999px;padding:8px 13px;transition:background .35s cubic-bezier(.2,.8,.2,1),color .35s;
}
.tools button:hover{background:rgba(47,44,39,.08)}
.tools button:focus-visible{outline:2px solid var(--moss);outline-offset:1px}
.tools button[aria-pressed="true"]{background:var(--ink);color:#f3ece0}
.tools .sep{width:1px;height:20px;background:rgba(47,44,39,.18)}
.toast{
  position:absolute;left:50%;bottom:clamp(76px,10vh,96px);transform:translate(-50%,10px);opacity:0;
  font-family:Georgia,serif;font-style:italic;font-size:15px;color:var(--ink);pointer-events:none;
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);white-space:nowrap;
}
.toast.on{opacity:.8;transform:translate(-50%,0)}
@media (max-width:560px){
  .title p{display:none}
  .tools span{display:none}
  .tools button{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  .toast,.tools button{transition:none}
}
</style>
</head>
<body>
<div class="garden" id="garden">
  <canvas id="c" aria-label="Raked sand garden. Drag to rake the sand, tap a stone to rake rings around it."></canvas>
  <div class="title">
    <div><div class="v">枯山水</div><div class="seal">K</div></div>
    <p><b>Kaisekitei · Dry Garden</b>Drag slowly through the sand to rake it. Touch a stone and the sand will settle into rings around it, like water that has forgotten how to move.</p>
  </div>
  <div class="toast" id="toast">the sand is still</div>
  <div class="tools" role="toolbar" aria-label="Rake tools">
    <span>Tines</span>
    <button type="button" data-t="3" aria-pressed="false">Three</button>
    <button type="button" data-t="5" aria-pressed="true">Five</button>
    <button type="button" data-t="8" aria-pressed="false">Eight</button>
    <i class="sep" aria-hidden="true"></i>
    <button type="button" id="smooth">Smooth</button>
    <button type="button" id="rerake">Re-rake</button>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var sand=document.createElement('canvas'),sx=sand.getContext('2d');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  var W=0,H=0,dpr=1,GAP=9,tines=5,pattern=null,dirty=true;
  var toast=document.getElementById('toast'),toastT=0;

  // grain tile
  var tile=document.createElement('canvas');tile.width=tile.height=96;
  (function(){var t=tile.getContext('2d');t.fillStyle='#d8ccb4';t.fillRect(0,0,96,96);
    for(var i=0;i<1400;i++){var v=Math.random();t.fillStyle=v<.5?'rgba(120,100,70,'+(Math.random()*.18)+')':'rgba(255,250,238,'+(Math.random()*.35)+')';t.fillRect(Math.random()*96,Math.random()*96,1,1)}})();

  var stones=[
    {x:.66,y:.42,r:.085,seed:3},{x:.74,y:.55,r:.045,seed:9},
    {x:.28,y:.7,r:.07,seed:5},{x:.52,y:.82,r:.035,seed:12},{x:.86,y:.22,r:.03,seed:7}
  ];
  function rnd(s){var x=Math.sin(s*999.7)*43758.5;return x-Math.floor(x)}
  function stonePx(s){var m=Math.min(W,H);return {x:s.x*W,y:s.y*H,r:Math.max(14,s.r*Math.max(m,W*.6))}}

  function buildSprite(s){
    var p=stonePx(s),pad=p.r*.9,size=Math.ceil((p.r+pad)*2);
    var c=document.createElement('canvas');c.width=size*dpr;c.height=size*dpr;
    var g=c.getContext('2d');g.scale(dpr,dpr);var cx=size/2,cy=size/2;
    var pts=[],n=16;
    for(var i=0;i<n;i++){var a=i/n*Math.PI*2,rr=p.r*(.82+rnd(s.seed+i)*.28);pts.push([cx+Math.cos(a)*rr*1.08,cy+Math.sin(a)*rr*.86])}
    function path(){g.beginPath();for(var i=0;i<=n;i++){var a=pts[i%n],b=pts[(i+1)%n],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(i===0)g.moveTo(mx,my);else g.quadraticCurveTo(a[0],a[1],mx,my)}g.closePath()}
    // moss collar
    for(i=0;i<70;i++){var a=rnd(s.seed*3+i)*Math.PI*2,rr=p.r*(.95+rnd(i+s.seed)*.2);
      g.fillStyle='rgba('+(80+rnd(i)*30|0)+','+(100+rnd(i*2)*30|0)+',60,'+(.35+rnd(i*5)*.4)+')';
      g.beginPath();g.arc(cx+Math.cos(a)*rr*1.05,cy+Math.sin(a)*rr*.86+3,2+rnd(i*7)*p.r*.07,0,Math.PI*2);g.fill()}
    g.save();g.shadowColor='rgba(40,30,15,.45)';g.shadowBlur=p.r*.35;g.shadowOffsetX=p.r*.12;g.shadowOffsetY=p.r*.18;
    path();g.fillStyle='#3d3a35';g.fill();g.restore();
    var gr=g.createRadialGradient(cx-p.r*.35,cy-p.r*.4,p.r*.05,cx,cy,p.r*1.2);
    gr.addColorStop(0,'#8a857b');gr.addColorStop(.45,'#55514a');gr.addColorStop(1,'#26241f');
    path();g.fillStyle=gr;g.fill();
    g.save();path();g.clip();
    for(i=0;i<40;i++){g.fillStyle='rgba(255,255,255,'+(rnd(i+s.seed*5)*.07)+')';g.fillRect(cx-p.r+rnd(i*3+s.seed)*p.r*2,cy-p.r+rnd(i*9)*p.r*2,1.5,1.5)}
    g.restore();
    s.sprite=c;s.size=size;
  }

  function groove(pathFn,w){
    sx.lineCap='round';sx.lineJoin='round';
    sx.save();sx.translate(-.9,-.9);sx.strokeStyle='rgba(110,90,62,.42)';sx.lineWidth=w||2;pathFn();sx.stroke();sx.restore();
    sx.save();sx.translate(1,1);sx.strokeStyle='rgba(255,250,240,.55)';sx.lineWidth=(w||2)*.8;pathFn();sx.stroke();sx.restore();
  }
  function smoothAll(){sx.fillStyle=pattern;sx.fillRect(0,0,W,H)}
  function lines(){
    smoothAll();
    for(var y=GAP/2;y<H+GAP;y+=GAP){(function(y){groove(function(){sx.beginPath();sx.moveTo(-4,y);sx.lineTo(W+4,y)})})(y)}
  }
  function rings(s){
    var p=stonePx(s),R=p.r*1.15,count=6;
    sx.fillStyle=pattern;sx.beginPath();sx.ellipse(p.x,p.y,(R+GAP*count+4)*1.08,(R+GAP*count+4)*.9,0,0,Math.PI*2);sx.fill();
    for(var i=0;i<count;i++){(function(rr){groove(function(){sx.beginPath();sx.ellipse(p.x,p.y,rr*1.08,rr*.9,0,0,Math.PI*2)})})(R+i*GAP)}
    dirty=true;
  }
  function rerake(){lines();stones.forEach(rings);dirty=true}

  function resize(){
    var r=cv.getBoundingClientRect(),nw=r.width,nh=r.height;
    var old=null;if(W>0){old=document.createElement('canvas');old.width=sand.width;old.height=sand.height;old.getContext('2d').drawImage(sand,0,0)}
    dpr=Math.min(window.devicePixelRatio||1,2);W=nw;H=nh;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    sand.width=cv.width;sand.height=cv.height;sx.setTransform(dpr,0,0,dpr,0,0);
    pattern=sx.createPattern(tile,'repeat');
    stones.forEach(buildSprite);
    if(old){sx.save();sx.setTransform(1,0,0,1,0,0);sx.drawImage(old,0,0,sand.width,sand.height);sx.restore()}else rerake();
    dirty=true;
  }
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,120)});
  resize();

  function hitStone(x,y,m){for(var i=0;i<stones.length;i++){var p=stonePx(stones[i]);if(Math.hypot((x-p.x)/1.08,(y-p.y)/.9)<p.r+(m||0))return stones[i]}return null}

  var rake=null,ripples=[],pointer={x:-99,y:-99,in:false};
  function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.addEventListener('pointerdown',function(e){
    var p=pos(e);cv.setPointerCapture(e.pointerId);
    var st=hitStone(p.x,p.y);
    rake={x:p.x,y:p.y,stone:st,moved:0,nx:0,ny:1,prev:null};
  });
  cv.addEventListener('pointermove',function(e){
    var p=pos(e);pointer.x=p.x;pointer.y=p.y;pointer.in=true;dirty=true;
    if(!rake||rake.stone)return;
    var dx=p.x-rake.x,dy=p.y-rake.y,d=Math.hypot(dx,dy);
    if(d<4)return;
    rake.moved+=d;
    var nx=-dy/d,ny=dx/d;
    if(rake.prev){nx=rake.nx*.6+nx*.4;ny=rake.ny*.6+ny*.4;var l=Math.hypot(nx,ny)||1;nx/=l;ny/=l}
    var half=(tines-1)/2,width=(tines+1)*GAP;
    // smooth strip ahead
    sx.save();sx.lineCap='butt';sx.strokeStyle=pattern;sx.lineWidth=width;
    sx.beginPath();sx.moveTo(rake.x,rake.y);sx.lineTo(p.x,p.y);sx.stroke();sx.restore();
    var cur=[];
    for(var k=0;k<tines;k++){
      var o=(k-half)*GAP,tx=p.x+nx*o,ty=p.y+ny*o;
      cur.push(hitStone(tx,ty,6)?null:[tx,ty]);
    }
    if(rake.prev){
      for(k=0;k<tines;k++){(function(a,b){if(!a||!b)return;groove(function(){sx.beginPath();sx.moveTo(a[0],a[1]);sx.lineTo(b[0],b[1])})})(rake.prev[k],cur[k])}
    }
    rake.prev=cur;rake.x=p.x;rake.y=p.y;rake.nx=nx;rake.ny=ny;dirty=true;
  });
  function end(){
    if(rake&&rake.stone&&rake.moved<5){rings(rake.stone);var p=stonePx(rake.stone);ripples.push({x:p.x,y:p.y,r:p.r,t:0});say('rings settle around the stone')}
    else if(rake&&rake.moved>40)say(['the sand remembers','one line, then another','slower is better','breathe with the rake'][Math.random()*4|0]);
    rake=null;
  }
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',function(){pointer.in=false;dirty=true});

  function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toast.classList.remove('on')},2200)}

  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(b){
    b.addEventListener('click',function(){
      tines=+b.dataset.t;
      Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(o){o.setAttribute('aria-pressed',o===b?'true':'false')});
    });
  });
  document.getElementById('smooth').addEventListener('click',function(){smoothAll();dirty=true;say('the sand is still')});
  document.getElementById('rerake').addEventListener('click',function(){rerake();say('the morning raking is done')});

  // drifting petals
  var petals=[];for(var i=0;i<5;i++)petals.push({x:Math.random(),y:Math.random(),a:Math.random()*6,s:.3+Math.random()*.5});

  var last=performance.now();
  function frame(now){
    var dt=Math.min(50,now-last)/16.67;last=now;
    var anim=!reduce.matches;
    if(anim||dirty||ripples.length){
      ctx.drawImage(sand,0,0,W,H);
      // soft light falloff
      var g=ctx.createRadialGradient(W*.3,H*.2,0,W*.5,H*.5,Math.max(W,H)*.8);
      g.addColorStop(0,'rgba(255,248,230,.18)');g.addColorStop(1,'rgba(60,40,20,.22)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      for(var r=ripples.length-1;r>=0;r--){
        var rp=ripples[r];rp.t+=anim?dt*.012:.2;
        if(rp.t>=1){ripples.splice(r,1);continue}
        ctx.strokeStyle='rgba(255,250,238,'+(.5*(1-rp.t))+')';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.ellipse(rp.x,rp.y,(rp.r*1.2+rp.t*90)*1.08,(rp.r*1.2+rp.t*90)*.9,0,0,Math.PI*2);ctx.stroke();
      }
      stones.forEach(function(s){var p=stonePx(s);ctx.drawImage(s.sprite,p.x-s.size/2,p.y-s.size/2,s.size,s.size)});
      if(anim){
        petals.forEach(function(pt){
          pt.x+=.0004*pt.s*dt;pt.y+=.0006*pt.s*dt;pt.a+=.02*dt;
          if(pt.x>1.05||pt.y>1.05){pt.x=Math.random()*.6-.1;pt.y=-.05}
          var x=pt.x*W,y=pt.y*H;ctx.save();ctx.translate(x,y);ctx.rotate(pt.a);
          ctx.fillStyle='rgba(198,92,72,.75)';ctx.beginPath();ctx.ellipse(0,0,5,2.6,0,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='rgba(60,40,20,.12)';ctx.beginPath();ctx.ellipse(6,8,5,2.6,0,0,Math.PI*2);ctx.fill();ctx.restore();
        });
      }
      if(pointer.in&&!rake){
        var st=hitStone(pointer.x,pointer.y);
        cv.style.cursor=st?'pointer':'crosshair';
        if(!st){ctx.strokeStyle='rgba(47,44,39,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(pointer.x,pointer.y,(tines+1)*GAP/2,0,Math.PI*2);ctx.stroke()}
      }
      dirty=false;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
