<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbra Observatory: Totality Study</title>
<style>
:root{
  --bone:#efe6d4;
  --dim:rgba(239,230,212,.55);
  --line:rgba(239,230,212,.18);
  --flare:#ff6a4a;
  --gold:#e9c27a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#03040a;color:var(--bone);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  overflow:hidden;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:ew-resize}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3.5vw,40px)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mark{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-family:"Helvetica Neue",Arial,sans-serif}
h1{font-weight:400;font-size:clamp(30px,5.4vw,64px);line-height:.95;letter-spacing:-.01em;margin-top:10px}
h1 em{font-style:italic;color:var(--gold)}
.coords{text-align:right;font-family:ui-monospace,"Courier New",monospace;font-size:11px;line-height:1.7;color:var(--dim)}
.panel{
  pointer-events:auto;align-self:stretch;
  display:grid;grid-template-columns:auto 1fr auto;gap:clamp(14px,3vw,36px);align-items:end;
  border-top:1px solid var(--line);padding-top:18px;
}
.phase{min-width:12ch}
.phase small{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.phase strong{font-weight:400;font-style:italic;font-size:clamp(20px,2.6vw,28px);transition:color .6s}
.phase strong.tot{color:var(--gold)}
.track{display:flex;flex-direction:column;gap:10px}
.track label{display:flex;justify-content:space-between;font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:linear-gradient(90deg,var(--line),var(--bone) 50%,var(--line))}
input[type=range]::-moz-range-track{height:1px;background:linear-gradient(90deg,var(--line),var(--bone) 50%,var(--line))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#03040a;border:1px solid var(--bone);box-shadow:0 0 0 4px rgba(233,194,122,0);transition:box-shadow .3s}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#03040a;border:1px solid var(--bone)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(233,194,122,.35)}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(233,194,122,.2)}
.read{text-align:right}
.read .pct{font-size:clamp(34px,5vw,58px);line-height:.9;font-variant-numeric:tabular-nums}
.read .pct sup{font-size:.4em;color:var(--dim)}
.read button{
  margin-top:10px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bone);background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;
  transition:border-color .3s,background .3s,color .3s;
}
.read button:hover{border-color:var(--gold);color:var(--gold)}
.read button[aria-pressed=true]{background:var(--bone);color:#03040a;border-color:var(--bone)}
.read button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.note{font-size:13px;font-style:italic;color:var(--dim);max-width:34ch;margin-top:12px;line-height:1.5}
@media (max-width:640px){
  .panel{grid-template-columns:1fr auto}
  .track{grid-column:1/-1;order:3}
  .coords{display:none}
}
</style>
</head>
<body>
<canvas id="sky" aria-label="Animated solar eclipse. Drag horizontally to move the moon across the sun."></canvas>
<div class="ui">
  <div class="head">
    <div>
      <p class="mark">Umbra Observatory &middot; Plate IX</p>
      <h1>The hour the <em>sun</em><br>wears a crown</h1>
      <p class="note">Drag across the sky to steer the moon. Only in full shadow does the pale corona dare to show itself.</p>
    </div>
    <div class="coords">LAT 27&deg;41&prime;N<br>LON 15&deg;02&prime;W<br>ALT 2,316 m<br>SEEING 0.6&Prime;</div>
  </div>
  <div class="panel">
    <div class="phase"><small>Phase</small><strong id="phase">Partial</strong></div>
    <div class="track">
      <label for="transit"><span>Moon transit</span><span id="clock">00:00:00</span></label>
      <input id="transit" type="range" min="-1000" max="1000" value="-600">
    </div>
    <div class="read">
      <div class="pct" id="pct">0<sup>%</sup></div>
      <button type="button" id="auto" aria-pressed="true">Auto transit</button>
    </div>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('sky'),ctx=cv.getContext('2d');
  var slider=document.getElementById('transit'),phaseEl=document.getElementById('phase'),pctEl=document.getElementById('pct'),clockEl=document.getElementById('clock'),autoBtn=document.getElementById('auto');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  var W,H,dpr,R,cx,cy,corona,stars=[],proms=[];
  var pos=-0.6,auto=!reduce.matches,dragging=false,resumeAt=0,t0=performance.now();
  if(reduce.matches){pos=0;slider.value=0;}
  autoBtn.setAttribute('aria-pressed',String(auto));

  function rnd(a,b){return a+Math.random()*(b-a);}
  function smooth(e0,e1,x){var t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t);}

  function buildCorona(){
    var S=Math.ceil(R*9);
    corona=document.createElement('canvas');
    corona.width=S*dpr;corona.height=S*dpr;
    var c=corona.getContext('2d');c.scale(dpr,dpr);
    var o=S/2;c.translate(o,o);
    c.globalCompositeOperation='lighter';
    var g=c.createRadialGradient(0,0,R*.9,0,0,R*3.2);
    g.addColorStop(0,'rgba(255,248,235,.55)');g.addColorStop(.18,'rgba(240,232,220,.18)');g.addColorStop(1,'rgba(200,210,230,0)');
    c.fillStyle=g;c.beginPath();c.arc(0,0,R*3.2,0,Math.PI*2);c.fill();
    for(var i=0;i<220;i++){
      var a=Math.random()*Math.PI*2;
      var eq=Math.pow(Math.abs(Math.cos(a)),1.6);
      var L=R*(.3+Math.pow(Math.random(),2.2)*(1.2+eq*2.8));
      var w=rnd(.015,.09)+eq*.04;
      var bend=rnd(-.12,.12);
      var gr=c.createRadialGradient(0,0,R*.95,0,0,R+L);
      var al=rnd(.05,.16);
      gr.addColorStop(0,'rgba(255,250,240,'+al+')');gr.addColorStop(.5,'rgba(230,235,250,'+al*.35+')');gr.addColorStop(1,'rgba(210,220,255,0)');
      c.fillStyle=gr;c.beginPath();
      c.moveTo(Math.cos(a-w)*R*.95,Math.sin(a-w)*R*.95);
      c.quadraticCurveTo(Math.cos(a-w*.3+bend*.5)*(R+L*.5),Math.sin(a-w*.3+bend*.5)*(R+L*.5),Math.cos(a+bend)*(R+L),Math.sin(a+bend)*(R+L));
      c.quadraticCurveTo(Math.cos(a+w*.3+bend*.5)*(R+L*.5),Math.sin(a+w*.3+bend*.5)*(R+L*.5),Math.cos(a+w)*R*.95,Math.sin(a+w)*R*.95);
      c.closePath();c.fill();
    }
    c.lineWidth=.6;
    for(var j=0;j<90;j++){
      var b=Math.random()*Math.PI*2,len=R*rnd(.4,1.8);
      c.strokeStyle='rgba(255,255,255,'+rnd(.04,.12)+')';
      c.beginPath();c.moveTo(Math.cos(b)*R,Math.sin(b)*R);c.lineTo(Math.cos(b+.03)*(R+len),Math.sin(b+.03)*(R+len));c.stroke();
    }
  }
  function build(){
    stars=[];
    for(var i=0;i<260;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,p:Math.random()*6.28,s:rnd(.5,2)});
    proms=[];
    for(var k=0;k<7;k++)proms.push({a:Math.random()*Math.PI*2,span:rnd(.05,.16),h:rnd(.06,.16),ph:Math.random()*6.28,loops:1+(Math.random()*3|0)});
    buildCorona();
  }
  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    R=Math.min(W,H)*(W<640?.16:.13);
    cx=W/2;cy=H*(W<640?.47:.5);
    build();
  }
  function overlap(r1,r2,d){
    if(d>=r1+r2)return 0;
    if(d<=Math.abs(r1-r2))return Math.PI*Math.min(r1,r2)*Math.min(r1,r2);
    var a=r1*r1*Math.acos((d*d+r1*r1-r2*r2)/(2*d*r1));
    var b=r2*r2*Math.acos((d*d+r2*r2-r1*r1)/(2*d*r2));
    var c=.5*Math.sqrt((-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2));
    return a+b-c;
  }
  function phaseName(cov,tot,d){
    if(cov<=0)return 'Clear sun';
    if(tot>.6)return 'Totality';
    if(cov>.975)return 'Diamond ring';
    if(cov>.85)return 'Deep partial';
    return 'Partial';
  }

  function draw(now){
    var t=(now-t0)/1000;
    if(auto&&!dragging&&now>resumeAt){
      var sw=Math.sin(t*.18);pos=sw*sw*sw*1.05;
      slider.value=Math.round(Math.max(-1,Math.min(1,pos))*1000);
    }
    var mR=R*1.06;
    var mx=cx+pos*R*2.4,my=cy+pos*R*.22;
    var dx=mx-cx,dy=my-cy,d=Math.sqrt(dx*dx+dy*dy);
    var cov=overlap(R,mR,d)/(Math.PI*R*R);
    var sun=1-cov;
    var tot=smooth(.995,1,cov);
    var light=Math.pow(sun,.45);

    // sky
    var sky=ctx.createRadialGradient(cx,cy,R,cx,cy,Math.max(W,H)*.8);
    var top='rgb('+Math.round(4+light*58)+','+Math.round(6+light*86)+','+Math.round(14+light*140)+')';
    var bot='rgb('+Math.round(2+light*20)+','+Math.round(3+light*30)+','+Math.round(8+light*60)+')';
    sky.addColorStop(0,top);sky.addColorStop(1,bot);
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    // horizon afterglow at totality
    if(tot>0){
      var hz=ctx.createLinearGradient(0,H*.7,0,H);
      hz.addColorStop(0,'rgba(255,120,60,0)');hz.addColorStop(1,'rgba(255,120,60,'+(.22*tot)+')');
      ctx.fillStyle=hz;ctx.fillRect(0,H*.7,W,H*.3);
    }
    // stars
    var sA=smooth(.9,1,cov);
    if(sA>0){
      ctx.fillStyle='#fff';
      for(var i=0;i<stars.length;i++){var s=stars[i];ctx.globalAlpha=sA*(.35+.65*(.5+.5*Math.sin(t*s.s+s.p)));ctx.fillRect(s.x,s.y,s.r,s.r);}
      ctx.globalAlpha=1;
    }
    // corona
    var cA=smooth(.93,1,cov);cA=cA*cA;
    if(cA>0){
      var S=corona.width/dpr;
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(cx,cy);
      var breathe=reduce.matches?1:1+Math.sin(t*.6)*.015;
      ctx.globalAlpha=cA;ctx.rotate(t*.004);ctx.scale(breathe,breathe);ctx.drawImage(corona,-S/2,-S/2,S,S);
      ctx.globalAlpha=cA*.45;ctx.rotate(-t*.011+1.3);ctx.scale(1.04,.98);ctx.drawImage(corona,-S/2,-S/2,S,S);
      ctx.restore();
    }
    // sun disc
    if(sun>0){
      var sg=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
      sg.addColorStop(0,'#fffef8');sg.addColorStop(.75,'#fff4d8');sg.addColorStop(1,'#ffd890');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    }
    // prominences & chromosphere
    var pA=smooth(.97,1,cov);
    if(pA>0){
      ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';
      ctx.shadowColor='rgba(255,70,60,.9)';ctx.shadowBlur=10;
      for(var p=0;p<proms.length;p++){
        var pr=proms[p];
        for(var l=0;l<pr.loops;l++){
          var wob=reduce.matches?0:Math.sin(t*.7+pr.ph+l)*.25;
          var h=mR*(1+pr.h*(1+wob)*(1-l*.2));
          var a0=pr.a-pr.span*(1-l*.25),a1=pr.a+pr.span*(1-l*.25);
          ctx.strokeStyle='rgba(255,'+(70+l*30)+',80,'+(.75*pA)+')';ctx.lineWidth=2.4-l*.5;
          ctx.beginPath();ctx.moveTo(Math.cos(a0)*R*.98,Math.sin(a0)*R*.98);
          ctx.bezierCurveTo(Math.cos(a0)*h*1.05,Math.sin(a0)*h*1.05,Math.cos(a1+.04*wob)*h*1.05,Math.sin(a1+.04*wob)*h*1.05,Math.cos(a1)*R*.98,Math.sin(a1)*R*.98);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    // moon
    var mg=ctx.createRadialGradient(mx-mR*.3,my-mR*.3,mR*.1,mx,my,mR);
    mg.addColorStop(0,'#0b0c12');mg.addColorStop(1,'#010104');
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mR,0,Math.PI*2);ctx.fill();
    if(tot>0){ctx.strokeStyle='rgba(255,90,70,'+(.5*tot)+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(mx,my,mR+.5,0,Math.PI*2);ctx.stroke();}
    // glare
    if(sun>0){
      var gx=cx-(d>0?dx/d:0)*R*cov*.7,gy=cy-(d>0?dy/d:0)*R*cov*.7;
      var gl=ctx.createRadialGradient(gx,gy,0,gx,gy,R*4);
      var ga=Math.pow(sun,.6)*.8;
      gl.addColorStop(0,'rgba(255,250,235,'+ga+')');gl.addColorStop(.25,'rgba(255,235,200,'+ga*.3+')');gl.addColorStop(1,'rgba(255,230,190,0)');
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.restore();
    }
    // diamond ring
    var dr=smooth(.95,.992,cov)*(1-tot);
    if(dr>0&&d>0){
      var bx=cx-dx/d*R,by=cy-dy/d*R;
      ctx.save();ctx.globalCompositeOperation='lighter';
      var bg=ctx.createRadialGradient(bx,by,0,bx,by,R*1.6);
      bg.addColorStop(0,'rgba(255,255,255,'+dr+')');bg.addColorStop(.08,'rgba(255,245,225,'+dr*.6+')');bg.addColorStop(1,'rgba(255,240,210,0)');
      ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,R*1.6,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,'+dr*.8+')';
      for(var k=0;k<6;k++){var ang=k*Math.PI/3+.3,ln=R*(k%2?.5:1.1)*dr;ctx.lineWidth=k%2?.8:1.4;ctx.beginPath();ctx.moveTo(bx-Math.cos(ang)*ln,by-Math.sin(ang)*ln);ctx.lineTo(bx+Math.cos(ang)*ln,by+Math.sin(ang)*ln);ctx.stroke();}
      ctx.restore();
    }

    // readouts
    var pc=Math.round(cov*1000)/10;
    pctEl.firstChild.nodeValue=(pc>=100?'100':pc.toFixed(1));
    var name=phaseName(cov,tot,d);
    if(phaseEl.textContent!==name){phaseEl.textContent=name;phaseEl.className=name==='Totality'?'tot':'';}
    var secs=Math.round(11*3600+47*60+pos*2400);
    var hh=Math.floor(secs/3600),mm=Math.floor(secs%3600/60),ss=secs%60;
    clockEl.textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss+' UT';
    requestAnimationFrame(draw);
  }

  function setFromX(x){pos=Math.max(-1,Math.min(1,(x-cx)/(Math.min(W*.42,R*2.6))));slider.value=Math.round(pos*1000);}
  function pause(){auto=false;autoBtn.setAttribute('aria-pressed','false');}
  cv.addEventListener('pointerdown',function(e){dragging=true;pause();cv.setPointerCapture(e.pointerId);setFromX(e.clientX);});
  cv.addEventListener('pointermove',function(e){if(dragging)setFromX(e.clientX);});
  cv.addEventListener('pointerup',function(){dragging=false;});
  cv.addEventListener('pointercancel',function(){dragging=false;});
  slider.addEventListener('input',function(){pause();pos=slider.value/1000;});
  autoBtn.addEventListener('click',function(){
    auto=!auto;autoBtn.setAttribute('aria-pressed',String(auto));
    if(auto){t0=performance.now()-Math.asin(Math.cbrt(Math.max(-1,Math.min(1,pos/1.05))))/.18*1000;}
  });
  window.addEventListener('resize',resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
